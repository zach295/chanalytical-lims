name: Apply COA Report Date Update
on:
  push:
    paths:
      - '.github/workflows/apply-coa-report-date-update.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/add_coa_report_date_update.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/send-report.js
          grep -q "COA Report Date Updated" api/src/send-report.js
          grep -q "Form Responses column G" api/src/send-report.js
          grep -q "coaReportDateWarning" api/src/send-report.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/send-report.js
          git commit -m "Write sent report date to COA sheet"
          git push
