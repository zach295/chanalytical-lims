name: Fix Queue Refresh Delay
on:
  push:
    paths:
      - '.github/workflows/fix-queue-refresh-delay.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/fix_queue_refresh_delay.py
      - name: Validate
        run: |
          git diff --check
          grep -q "Scan processed — loading review queue" admin-dashboard.html
          ! grep -q "attempts >= 12" admin-dashboard.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html
          git commit -m "Remove delayed Review Queue polling"
          git push