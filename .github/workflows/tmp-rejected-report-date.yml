name: Temporary rejected report date patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-rejected-report-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: node .tmp_patch_rejected_report_date.js
      - name: Validate JavaScript
        run: node --check api/src/approve-scan.js
      - name: Validate targeted behavior
        run: |
          grep -F 'isRejected:      !!(item.isRejection || item.isRejected)' api/src/approve-scan.js
          grep -F 'fields["Report Date"] = m + '\''/'\'' + d + '\''/'\'' + String(y).slice(-2);' api/src/approve-scan.js
          grep -F 'fields["Report Date"] = '\'''\'';' api/src/approve-scan.js
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/approve-scan.js
          git diff --cached --quiet && exit 0
          git commit -m 'Set report dates for rejected samples'
          git push
