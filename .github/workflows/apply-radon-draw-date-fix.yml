name: Apply Radon Draw Date Fix
on:
  push:
    paths:
      - '.github/workflows/apply-radon-draw-date-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_radon_draw_date.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/update-sample.js
          grep -q "Updated E.*draw date" api/src/update-sample.js
          grep -q "context, updates" api/src/update-sample.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/update-sample.js
          git commit -m "Update radon draw date during sample correction"
          git push
