name: Fix Scan Refresh Race
on:
  push:
    paths:
      - '.github/workflows/fix-scan-refresh-race.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/fix_scan_refresh_race.py
      - name: Validate
        run: |
          git diff --check
          grep -q "waitForExistingLoad" admin-dashboard.html
          grep -q "while (_rqLoading" admin-dashboard.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html
          git commit -m "Fix Review Queue refresh race after scan"
          git push