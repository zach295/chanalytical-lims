name: Apply Control Sheet Hardening
on:
  push:
    paths:
      - '.github/workflows/apply-control-sheet-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/harden_control_sheet_write.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/approve-scan.js
          grep -q "Wrote and verified" api/src/approve-scan.js
          grep -q "createSession attempt" api/src/approve-scan.js
          grep -q "Total control sheet step" api/src/approve-scan.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/approve-scan.js
          git commit -m "Retry and verify control sheet writes"
          git push
