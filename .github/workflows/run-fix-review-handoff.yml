name: Run Review Handoff Fix
on:
  push:
    paths:
      - '.github/workflows/run-fix-review-handoff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_review_handoff.py
      - run: node --check api/src/get-scan-queue.js
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-dashboard.html api/src/get-scan-queue.js
          git commit -m "Fix Review Queue review data handoff"
          git push
