name: Fix radon correction filename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-radon-correction-filename.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct radon control sheet filename
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/src/update-sample.js')
          s = p.read_text()
          old = "const fileName    = `C_${datePrefix}.xlsx`; // same naming as control sheet"
          new = "const fileName    = `RCS_${datePrefix}.xlsx`; // radon control sheet naming"
          if old not in s:
            raise SystemExit('Expected radon filename line not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Validate
        run: |
          node --check api/src/update-sample.js
          grep -q 'RCS_${datePrefix}.xlsx' api/src/update-sample.js
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/update-sample.js
          git commit -m "Fix radon sample correction sheet filename"
          git push origin main
