name: Fix shared import date filter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shared-import-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore one shared date filter for all imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin-dashboard.html')
          s = p.read_text()

          # Rename the current Radon-only selector to the shared selector.
          s = s.replace('id="radon-import-date" aria-label="Radon import date"',
                        'id="import-date-filter" aria-label="Import results date"', 1)
          s = s.replace('          Radon Date\n', '          Import Date\n', 1)

          # Helper used by every import button.
          marker = '  async function importPH(btn) {'
          helper = '''  function getImportDatePrefix() {\n    const dateInput = document.getElementById('import-date-filter');\n    let selectedDate = dateInput?.value || '';\n    if (!selectedDate) {\n      selectedDate = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });\n      if (dateInput) dateInput.value = selectedDate;\n    }\n    const ymd = selectedDate.split('-');\n    const prefix = ymd.length === 3 ? `${ymd[1]}${ymd[2]}${ymd[0].slice(-2)}` : '';\n    if (!/^\\d{6}$/.test(prefix)) throw new Error('Select a valid import date');\n    return prefix;\n  }\n\n'''
          if 'function getImportDatePrefix()' not in s:
            if marker not in s: raise SystemExit('importPH marker not found')
            s = s.replace(marker, helper + marker, 1)

          # pH and bacteria now send the shared date.
          s = s.replace("const res  = await fetch('/api/import-ph', { method: 'POST' });",
                        "const datePrefix = getImportDatePrefix();\n      const res  = await fetch('/api/import-ph', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ datePrefix }) });", 1)
          s = s.replace("const res  = await fetch('/api/import-bacteria', { method: 'POST' });",
                        "const datePrefix = getImportDatePrefix();\n      const res  = await fetch('/api/import-bacteria', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ datePrefix }) });", 1)

          # Radon uses the same shared selector.
          old_radon = '''      const dateInput = document.getElementById('radon-import-date');\n      let selectedDate = dateInput?.value || '';\n      if (!selectedDate) {\n        selectedDate = new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });\n        if (dateInput) dateInput.value = selectedDate;\n      }\n      const ymd = selectedDate.split('-');\n      const dateFilter = ymd.length === 3 ? `${ymd[1]}${ymd[2]}${ymd[0].slice(-2)}` : '';\n      if (!dateFilter) throw new Error('Select a valid radon date');'''
          new_radon = '''      const dateFilter = getImportDatePrefix();'''
          if old_radon in s:
            s = s.replace(old_radon, new_radon, 1)
          else:
            # tolerate already-renamed id if the prior deployment changed only that token
            s = re.sub(r"      const dateInput = document\.getElementById\('import-date-filter'\);.*?      if \(!dateFilter\) throw new Error\('Select a valid radon date'\);",
                       new_radon, s, count=1, flags=re.S)

          # ICP-MS / Control shared runImport sends datePrefix too.
          old = "body: JSON.stringify({ all: true }),"
          new = "body: JSON.stringify({ all: true, datePrefix: getImportDatePrefix() }),"
          if old not in s: raise SystemExit('runImport body not found')
          s = s.replace(old, new, 1)

          # Standalone control-sheet importer also uses the shared date if called elsewhere.
          s = s.replace("body: JSON.stringify({ uploadedBy: getAdminName() }),",
                        "body: JSON.stringify({ uploadedBy: getAdminName(), datePrefix: getImportDatePrefix() }),", 1)

          p.write_text(s)

          # pH backend was referencing dateFilter without defining it.
          p = Path('api/src/import-ph.js')
          s = p.read_text()
          marker = "      const siteId  = process.env.SP_SITE_ID;"
          insert = "      const body = await request.json().catch(() => ({}));\n      const dateFilter = String(body.datePrefix || body.dateFilter || '').trim();\n"
          if 'const dateFilter =' not in s:
            if marker not in s: raise SystemExit('pH siteId marker not found')
            s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          # Radon accepts the common datePrefix name as well as dateFilter.
          p = Path('api/src/import-radon.js')
          s = p.read_text()
          s = s.replace("const rawDateFilter = String(reqBody.dateFilter || '').trim();",
                        "const rawDateFilter = String(reqBody.datePrefix || reqBody.dateFilter || '').trim();", 1)
          p.write_text(s)

          # Control importer: use the selected cache rows when grouping by date.
          p = Path('api/src/import-control.js')
          s = p.read_text()
          s = s.replace('for (const item of needsControl) {', 'for (const item of cacheItems) {', 1)
          p.write_text(s)
          PY

      - name: Validate
        run: |
          node --check api/src/import-ph.js
          node --check api/src/import-radon.js
          node --check api/src/import-control.js
          grep -q 'id="import-date-filter"' admin-dashboard.html
          grep -q 'function getImportDatePrefix' admin-dashboard.html
          grep -q "import-bacteria.*datePrefix\|JSON.stringify({ datePrefix })" admin-dashboard.html
          grep -q 'datePrefix: getImportDatePrefix()' admin-dashboard.html
          ! grep -q 'radon-import-date' admin-dashboard.html

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html api/src/import-ph.js api/src/import-radon.js api/src/import-control.js
          git diff --cached --check
          git commit -m "Restore shared date filter for all result imports"
          git push origin main
