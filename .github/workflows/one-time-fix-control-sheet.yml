name: One-time fix control sheet creation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-control-sheet.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch daily control sheet creation
        run: |
          echo '' | base64 -d > /tmp/fix-control.py
          python3 /tmp/fix-control.py

      - name: Validate JavaScript
        run: node --check api/src/approve-scan.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/approve-scan.js
          git diff --cached --check
          git commit -m "Fix daily control sheet auto-creation"
          git push origin main
