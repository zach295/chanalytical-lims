name: One-time control template path fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-template-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch template discovery
        run: |
          echo '  ' | tr -d ' ' | base64 -d > /tmp/fix-template.py
          python3 /tmp/fix-template.py

      - name: Validate JavaScript
        run: node --check api/src/approve-scan.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/approve-scan.js
          git diff --cached --check
          git commit -m "Fix control sheet template discovery"
          git push origin main
