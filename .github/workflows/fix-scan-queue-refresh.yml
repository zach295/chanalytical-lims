name: Fix Scan Queue Refresh
on:
  push:
    paths:
      - '.github/workflows/fix-scan-queue-refresh.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/fix_scan_queue_refresh.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/scan-folder.js
          grep -q "expectedIds" admin-dashboard.html
          grep -q "fileId:       file.id" api/src/scan-folder.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html api/src/scan-folder.js
          git commit -m "Make Check Drive refresh wait for scanned file"
          git push