name: Apply COA Sheet Formatting Fixes
on:
  push:
    paths:
      - '.github/workflows/apply-coa-sheet-formatting.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_coa_sheet_formatting.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/approve-scan.js
          node --check api/src/send-report.js
          grep -q "Expanded Safety (Mtg Test)" api/src/approve-scan.js
          grep -q "Report Date is written only when the report is actually sent" api/src/approve-scan.js
          grep -q "valueInputOption: 'RAW'" api/src/approve-scan.js
          grep -q "Public-" api/src/approve-scan.js
          grep -q "reportDate5 =.*-.*-" api/src/send-report.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/approve-scan.js api/src/send-report.js
          git commit -m "Fix COA row placement and formatting"
          git push
