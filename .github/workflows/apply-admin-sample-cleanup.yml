name: Apply Admin Sample Cleanup
on:
  push:
    paths:
      - '.github/workflows/apply-admin-sample-cleanup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: python .github/scripts/patch_admin_sample_cleanup.py
      - name: Validate
        run: |
          git diff --check
          grep -q "section-admin" admin-dashboard.html
          grep -q "openSecureAdmin" admin-dashboard.html
          grep -q "adminDeleteSampleGroup" admin-dashboard.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-dashboard.html
          git commit -m "Add password-protected admin sample cleanup"
          git push
