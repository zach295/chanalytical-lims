name: Inspect Review Card
on:
  push:
    paths:
      - '.github/workflows/inspect-review-card.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('admin-dashboard.html').read_text()
          for needle in ['function buildScanCard','reviewQueueData =','openReviewApprove(','record.services','record.tests']:
              print('\n===',needle,'===')
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-900):i+4200])
                  start=i+len(needle)
          PY
