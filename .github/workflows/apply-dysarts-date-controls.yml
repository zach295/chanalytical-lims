name: Apply Dysarts date controls fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dysarts-date-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: node .github/scripts/fix-dysarts-date-controls.js
      - name: Validate wiring
        run: |
          grep -F "async function generateDysartsReport()" admin-dashboard.html
          grep -F "document.getElementById('report-date-from')" admin-dashboard.html
          grep -F "document.getElementById('report-date-to')" admin-dashboard.html
          node -e "const fs=require('fs');const s=fs.readFileSync('admin-dashboard.html','utf8');const i=s.indexOf('async function generateDysartsReport()');const c=s.slice(i,i+3000);if(c.includes('radon-company')||c.includes('Select a company first.'))process.exit(1);"
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Dysarts report date controls'
          git push
