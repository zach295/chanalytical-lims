name: Fix COA Approval Rows

on:
  push:
    paths:
      - '.github/workflows/fix-coa-approval-rows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch COA approval rows
        run: python3 .github/scripts/fix_coa_approval_rows.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/approve-scan.js
          grep -n "coaDisplayTest" api/src/approve-scan.js
          grep -n "reportDate," api/src/approve-scan.js
      - name: Commit changes
        run: |
          git config user.name "zach295"
          git config user.email "zach@chanalytical.com"
          git add api/src/approve-scan.js
          git commit -m "Fix COA approval row layout"
          git push origin main
