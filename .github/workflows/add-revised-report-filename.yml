name: Add Revised filename for re-reports

on:
  push:
    paths:
      - '.github/workflows/add-revised-report-filename.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/add_revised_report_filename.py
      - name: Validate
        run: |
          node --check api/src/send-report.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "zach295"
          git config user.email "zach@chanalytical.com"
          git add api/src/send-report.js
          git commit -m "Label reissued report PDFs as Revised"
          git push origin main
