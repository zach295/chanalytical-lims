name: Fix Statistics and Multi-Element Pricing

on:
  push:
    paths:
      - '.github/workflows/fix-statistics-and-pricing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/fix_statistics_and_multi_element_pricing.py
      - name: Validate JavaScript
        run: |
          node --check api/src/approve-scan.js
          node --check api/src/update-sample.js
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html api/src/approve-scan.js api/src/update-sample.js
          git commit -m "Fix statistics and multi-element pricing"
          git push
