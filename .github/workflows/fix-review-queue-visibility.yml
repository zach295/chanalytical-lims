name: Fix Review Queue Visibility
on:
  push:
    paths:
      - '.github/workflows/fix-review-queue-visibility.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/fix_review_queue_visibility.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/scan-folder.js
          node --check api/src/get-scan-queue.js
          grep -q "ReviewStatus:     reviewStatus" api/src/scan-folder.js
          grep -q "SharePoint Review Queue is the source of truth" admin-dashboard.html
          grep -q "get-scan-queue?fresh=" admin-dashboard.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html api/src/scan-folder.js
          git commit -m "Fix Review Queue rows hidden from LIMS"
          git push
