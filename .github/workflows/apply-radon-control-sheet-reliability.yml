name: Apply Radon Control Sheet reliability fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-radon-control-sheet-reliability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: node .github/scripts/fix-radon-control-sheet-reliability.js
      - name: Validate RCS reliability logic
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('api/src/approve-scan.js','utf8');
          if(!s.includes('RCS workbook session failed after 3 attempts')) process.exit(1);
          if(!s.includes('already present in ${rcsName}')) process.exit(1);
          if(!s.includes('RCS write could not be verified for ${newLabId} after 3 attempts')) process.exit(1);
          if(!s.includes('rcsWarning: rcsWarning || undefined')) process.exit(1);
          if(!s.includes('rcsStatus,')) process.exit(1);
          NODE
      - name: Syntax check
        run: node --check api/src/approve-scan.js
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/approve-scan.js
          git diff --cached --quiet && exit 0
          git commit -m 'Retry and verify Radon Control Sheet writes'
          git push
