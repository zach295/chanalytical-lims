name: Optimize COC Scan and RTB

on:
  push:
    paths:
      - '.github/workflows/optimize-coc-scan-and-rtb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/optimize_coc_scan_and_rtb.py
      - name: Validate JavaScript
        run: |
          node --check api/src/scan-folder.js
          node --check api/src/approve-scan.js
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/scan-folder.js api/src/approve-scan.js
          git commit -m "Speed up COC scanning and RTB writes"
          git push
