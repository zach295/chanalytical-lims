name: Fix COA Lab ID and Quantity

on:
  push:
    paths:
      - '.github/workflows/fix-coa-labid-qty.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch COA Lab ID and quantity
        run: python3 .github/scripts/fix_coa_labid_qty.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/approve-scan.js
          grep -n "SHEETS_TAB}!A:N" api/src/approve-scan.js
          grep -n "l.baseId" api/src/approve-scan.js
      - name: Commit changes
        run: |
          git config user.name "zach295"
          git config user.email "zach@chanalytical.com"
          git add api/src/approve-scan.js
          git commit -m "Write base Lab ID and quantity to COA sheet"
          git push origin main
