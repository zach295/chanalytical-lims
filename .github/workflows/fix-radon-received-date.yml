name: Fix Radon Received Date
on:
  push:
    paths:
      - '.github/workflows/fix-radon-received-date.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_radon_received_date.py
      - run: git diff --check
      - run: node --check api/src/approve-scan.js
      - run: grep -q 'receivedFmt' api/src/approve-scan.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/approve-scan.js
          git commit -m "Use corrected received date on radon control sheet"
          git push
