name: Apply Admin Password Sync
on:
  push:
    paths:
      - '.github/workflows/apply-admin-password-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fix
        run: python .github/scripts/fix_admin_password_sync.py
      - name: Validate
        run: |
          git diff --check
          grep -q "action: 'setpw', email, password: pw" login.html
          grep -q "body.password || body.newPassword" api/src/users-manage.js
          grep -q "Verify through the same authentication path" admin-dashboard.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add login.html api/src/users-manage.js admin-dashboard.html
          git commit -m "Keep admin unlock password in sync with LIMS login"
          git push
