name: Fix Activity Log Military Time

on:
  push:
    paths:
      - '.github/workflows/fix-activity-log-military-time.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Activity Log military time fix
        run: python3 .github/scripts/fix_activity_log_military_time.py
      - name: Validate
        run: |
          git diff --check
          grep -n "formatActivityMilitaryTime" admin-dashboard.html
          node --check api/shared/audit.js
      - name: Commit changes
        run: |
          git config user.name "zach295"
          git config user.email "zach@chanalytical.com"
          git add admin-dashboard.html
          git commit -m "Show Activity Log times in military format"
          git push origin main
