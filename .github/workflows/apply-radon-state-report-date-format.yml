name: Apply Radon state report date formatter fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-radon-state-report-date-format.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: node .github/scripts/fix-radon-state-report-date-format.js
      - name: Validate date formatter
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('admin-dashboard.html','utf8');
          const i=s.indexOf('async function generateRadonStateReport()');
          const c=s.slice(i,i+8000);
          if(!c.includes("const raw = String(d).trim();")) process.exit(1);
          if(!c.includes("'20' + us[3]")) process.exit(1);
          if(!c.includes("return us[1].padStart(2,'0') + '/' + us[2].padStart(2,'0') + '/' + year;")) process.exit(1);
          NODE
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Radon state report date formatting'
          git push
