name: Fix report archive by Lab ID date

on:
  push:
    paths:
      - '.github/workflows/fix-report-archive-by-lab-date.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Archive reports by Lab ID date
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/src/send-report.js')
          s = p.read_text()
          old = """        const archiveDate  = new Date();
        const monthFolder  = archiveDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'America/New_York' });
        const dayFolder    = archiveDate.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit', timeZone: 'America/New_York' }).replace(/\\//g, '-');
"""
          new = """        // Archive by the accession date encoded in the first 6 digits of the Lab ID (MMDDYY),
        // not by the date the report happens to be emailed.
        const datePrefix   = String(labId).match(/(\\d{6})-\\d{3}/)?.[1];
        if (!datePrefix) throw new Error(`Cannot determine archive date from Lab ID: ${labId}`);
        const mm           = parseInt(datePrefix.slice(0, 2), 10);
        const dd           = parseInt(datePrefix.slice(2, 4), 10);
        const yy           = parseInt(datePrefix.slice(4, 6), 10);
        const archiveDate  = new Date(Date.UTC(2000 + yy, mm - 1, dd, 12, 0, 0));
        const monthFolder  = archiveDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
        const dayFolder    = `${datePrefix.slice(0,2)}-${datePrefix.slice(2,4)}-${datePrefix.slice(4,6)}`;
"""
          if old not in s:
              raise SystemExit('Expected archive-date block not found; no changes made')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check api/src/send-report.js
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "zach295"
          git config user.email "zach@chanalytical.com"
          git add api/src/send-report.js
          git commit -m "Archive reports by Lab ID date"
          git push origin main
