name: Add old value to result audit log

on:
  push:
    paths:
      - '.github/workflows/add-old-value-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/add_old_value_audit.py
      - name: Validate
        run: |
          node --check api/src/patch-report-cell.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "zach295"
          git config user.email "zach@chanalytical.com"
          git add api/src/patch-report-cell.js
          git commit -m "Log old and new result values"
          git push origin main
