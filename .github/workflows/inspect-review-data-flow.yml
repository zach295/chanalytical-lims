name: Inspect Review Queue Data Flow
on:
  push:
    paths:
      - '.github/workflows/inspect-review-data-flow.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show review queue frontend functions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('admin-dashboard.html').read_text()
          for needle in ['async function loadReviewQueue','function renderReview','function openReview','function review','review-queue-body','get-scan-queue']:
              print('\n===',needle,'===')
              i=s.find(needle)
              if i>=0: print(s[max(0,i-1200):i+6000])
          PY
      - name: Show Review Queue writer
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('api/src/scan-folder.js').read_text()
          for needle in ['REVIEW_QUEUE','Review Queue','createListItem','addListItem','TestSelections','OCRDebug']:
              print('\n===',needle,'===')
              i=s.find(needle)
              if i>=0: print(s[max(0,i-1800):i+5000])
          PY
