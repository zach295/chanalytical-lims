name: Inspect TestSelection Write
on:
  push:
    paths:
      - '.github/workflows/inspect-testselection-write.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -n -C 8 "TestSelections" api/src/scan-folder.js
          grep -n -C 6 "reviewQueueData" admin-dashboard.html | head -120
