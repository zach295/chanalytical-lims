name: Apply Report Date Billing Fix
on:
  push:
    paths:
      - '.github/workflows/apply-report-date-billing-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_report_date_billing.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/send-report.js
          grep -q "Billing Report Date Updated" api/src/send-report.js
          grep -q "billingDateWarning" api/src/send-report.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/send-report.js
          git commit -m "Fix report date billing updates and audit logging"
          git push
