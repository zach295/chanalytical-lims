name: Fix COA Google Write

on:
  push:
    paths:
      - '.github/workflows/fix-coa-google-write.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/fix_coa_google_write.py
      - name: Validate JavaScript
        run: |
          node --check api/src/approve-scan.js
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/approve-scan.js
          git commit -m "Make COA Google Sheet write reliable"
          git push
