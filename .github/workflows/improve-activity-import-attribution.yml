name: Improve Activity Import Attribution

on:
  push:
    paths:
      - '.github/workflows/improve-activity-import-attribution.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Activity Log attribution/date fixes
        run: python3 .github/scripts/improve_activity_import_attribution.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/import-icpms.js
          node --check api/src/import-control.js
          node --check api/src/import-acid.js
          node --check api/src/inventory-write.js
          grep -n "formatActivityDate" admin-dashboard.html
          grep -n "importedBy: getAdminName()" admin-dashboard.html
      - name: Commit changes
        run: |
          git config user.name "zach295"
          git config user.email "zach@chanalytical.com"
          git add admin-dashboard.html api/src/import-icpms.js api/src/import-control.js api/src/import-acid.js api/src/inventory-write.js
          git commit -m "Track result importers and normalize Activity Log dates"
          git push origin main
