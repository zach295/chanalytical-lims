name: Apply COA Append Hardening
on:
  push:
    paths:
      - '.github/workflows/apply-coa-append-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/harden_coa_append.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/approve-scan.js
          grep -q 'Google Sheets verification missing Lab ID' api/src/approve-scan.js
          grep -q 'attempt ${attempt}/3 failed' api/src/approve-scan.js
          grep -q 'written:${sheetResult.rows}:attempt${sheetResult.attempt}' api/src/approve-scan.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/approve-scan.js
          git commit -m "Retry and verify COA Google Sheet writes"
          git push
