name: Apply Hardness Report Components
on:
  push:
    paths:
      - '.github/workflows/apply-hardness-report-components.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/fix_hardness_report_components.py
      - name: Validate
        run: |
          git diff --check
          node --check api/src/generate-report.js
          grep -q "Hardness included" api/src/generate-report.js
          grep -q "needed.add('Calcium, Total')" api/src/generate-report.js
          grep -q "needed.add('Magnesium, Total')" api/src/generate-report.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/src/generate-report.js
          git commit -m "Include calcium and magnesium with hardness reports"
          git push
