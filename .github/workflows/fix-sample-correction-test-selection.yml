name: Fix sample correction test selection

on:
  push:
    paths:
      - '.github/workflows/fix-sample-correction-test-selection.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aggregate all Archived Intake tests in Sample Correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-dashboard.html')
          s = p.read_text()
          old = """      // Use first match (primary sample row)\n      const raw = matches[0];\n      const found = {\n        labId:        raw.field_1  || '',\n        coaTest:      raw.field_2  || '',\n"""
          new = """      // Use first match for shared sample metadata, but preserve ALL test rows\n      // for this Lab ID. Individual-element samples can have one Archived Intake row\n      // per test (for example Total Hardness, Iron, Total, and Manganese, Total).\n      const raw = matches[0];\n      const allTests = [...new Set(matches.flatMap(r =>\n        String(r.field_2 || '').split(/[|;]/).map(t => t.trim()).filter(Boolean)\n      ))];\n      const combinedCoaTest = allTests.join(' | ');\n      const found = {\n        labId:        raw.field_1  || '',\n        coaTest:      combinedCoaTest,\n"""
          if old not in s:
              raise SystemExit('Expected Sample Correction block not found; no changes made')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "zach295"
          git config user.email "zach@chanalytical.com"
          git add admin-dashboard.html
          git commit -m "Fix Sample Correction preserving all tests"
          git push origin main
