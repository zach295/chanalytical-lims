name: Apply Dysarts report wiring fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dysarts-report-wiring.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted patch
        run: node .github/scripts/fix-dysarts-report-function.js
      - name: Validate wiring
        run: |
          grep -F 'onclick="generateDysartsReport()"' admin-dashboard.html
          grep -F 'async function generateDysartsReport()' admin-dashboard.html
          grep -F "document.getElementById('report-date-from')" admin-dashboard.html
          grep -F "'madden home inspections','yankee home inspections'" admin-dashboard.html
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Dysarts report button wiring'
          git push
