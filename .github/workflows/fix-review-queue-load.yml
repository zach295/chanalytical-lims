name: Fix Review Queue Load
on:
  push:
    paths:
      - '.github/workflows/fix-review-queue-load.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_review_queue_load.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-dashboard.html
          git commit -m "Do not block Review Queue on client refresh"
          git push
